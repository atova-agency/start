<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" style="background:#f5f7f8">
  <defs>
    <!-- Stone & Slate Gradients -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" /> <!-- Light slate -->
      <stop offset="100%" stop-color="#94a3b8" /> <!-- Medium slate -->
    </linearGradient>
    
    <!-- Stone Pattern -->
    <pattern id="stone" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#e2e8f0"/>
      <circle cx="10" cy="10" r="3" fill="#cbd5e1" opacity="0.6"/>
      <circle cx="30" cy="20" r="4" fill="#cbd5e1" opacity="0.6"/>
      <circle cx="25" cy="35" r="2" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#sky)"/>
  
  <!-- Baobab Silhouettes -->
  <g fill="#475569"> <!-- Dark slate -->
    <path d="M150 350 l-30 -200 l60 0 l-30 200z"/>
    <path d="M250 320 l-20 -150 l40 0 l-20 150z"/>
    <path d="M1050 340 l-25 -180 l50 0 l-25 180z"/>
  </g>

  <!-- Antananarivo Skyline -->
  <g fill="#475569"> <!-- Slate gray -->
    <rect x="400" y="250" width="30" height="100"/>
    <rect x="450" y="200" width="40" height="150"/>
    <rect x="510" y="220" width="35" height="130" fill="#64748b"/> <!-- Medium slate -->
    <rect x="570" y="180" width="50" height="170"/>
    <rect x="650" y="230" width="45" height="120" fill="#64748b"/> 
  </g>

  <!-- Stick Figure Developers -->
  <g transform="translate(500 200)" stroke="#1e293b" stroke-width="2">
    <!-- Developer 1 -->
    <circle cx="0" cy="-20" r="8" fill="none"/> <!-- Head -->
    <line x1="0" y1="-12" x2="0" y2="20"/> <!-- Body -->
    <line x1="0" y1="0" x2="-15" y2="10"/> <!-- Left arm -->
    <line x1="0" y1="0" x2="15" y2="10"/> <!-- Right arm -->
    <line x1="0" y1="20" x2="-10" y2="40"/> <!-- Left leg -->
    <line x1="0" y1="20" x2="10" y2="40"/> <!-- Right leg -->
    
    <!-- Developer 2 -->
    <circle cx="50" cy="-20" r="8" fill="none"/>
    <line x1="50" y1="-12" x2="50" y2="20"/>
    <line x1="50" y1="5" x2="35" y2="0"/>
    <line x1="50" y1="5" x2="65" y2="0"/>
    <line x1="50" y1="20" x2="40" y2="40"/>
    <line x1="50" y1="20" x2="60" y2="40"/>
  </g>

  <!-- Mobile Device -->
  <g transform="translate(200 100)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="120" height="220" rx="15" fill="#475569"/>
    <rect x="10" y="10" width="100" height="200" rx="10" fill="#f1f5f9"/>
    
    <!-- App Interface -->
    <rect x="25" y="30" width="70" height="20" fill="#64748b" rx="5"/>
    <circle cx="60" cy="90" r="20" fill="#94a3b8"/>
    <rect x="30" y="130" width="60" height="15" fill="#cbd5e1" rx="3"/>
    <rect x="30" y="155" width="60" height="15" fill="#cbd5e1" rx="3"/>
    
    <!-- Hands -->
    <path d="M-20 50 Q0 40, 0 80 Q0 120, -20 110" fill="#f8fafc" opacity="0.8"/>
    <path d="M140 50 Q120 40, 120 80 Q120 120, 140 110" fill="#f8fafc" opacity="0.8"/>
  </g>

  <!-- Laptop with Rust Code -->
  <g transform="translate(700 150)">
    <!-- Screen -->
    <rect x="0" y="0" width="180" height="120" fill="#475569" rx="5"/>
    <rect x="10" y="10" width="160" height="100" fill="#f1f5f9" rx="3"/>
    
    <!-- Rust Code Display -->
    <text x="20" y="30" font-family="monospace" font-size="10" fill="#1e293b">
      <tspan x="20" dy="1.2em">fn main() {</tspan>
      <tspan x="30" dy="1.2em">// Malagasy innovation</tspan>
      <tspan x="30" dy="1.2em">let tech_growth = true;</tspan>
      <tspan x="30" dy="1.2em">println!("Hello Mada!");</tspan>
      <tspan x="20" dy="1.2em">}</tspan>
    </text>
    
    <!-- Keyboard Base -->
    <rect x="-20" y="120" width="220" height="20" fill="#475569" rx="3"/>
  </g>

  <!-- Lemur Tech Symbol -->
  <g transform="translate(900 100)" stroke="#475569" stroke-width="2">
    <!-- Wi-Fi Waves -->
    <circle cx="60" cy="60" r="25" fill="none" stroke-dasharray="4 4"/>
    <circle cx="60" cy="60" r="15" fill="none" stroke-dasharray="4 4"/>
    <circle cx="60" cy="60" r="5" fill="#475569"/>
    
    <!-- Lemur Head -->
    <circle cx="60" cy="40" r="15" fill="none"/>
    <circle cx="55" cy="38" r="2" fill="#1e293b"/>
    <circle cx="65" cy="38" r="2" fill="#1e293b"/>
  </g>

  <!-- Stone Pattern Border -->
  <rect x="0" y="380" width="1200" height="20" fill="url(#stone)"/>
  
  <!-- Title Text -->
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="36" fill="#1e293b" font-weight="bold">
    Mobile App Development
    <tspan x="600" dy="40" font-size="32">Madagascar</tspan>
  </text>
</svg>