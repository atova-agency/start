<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bgGradient" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#363636" />
      <stop offset="100%" stop-color="#636363" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Gradient background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <!-- Diagonal binary streams -->
  <g fill="#b3937b" font-family="monospace" font-size="14" 
     font-style="italic" filter="url(#glow)" opacity="0.9">
    <!-- Main diagonal streams -->
    <text transform="translate(50,190) rotate(-30)">
      01011010 10010110 01011001 10100101 01101001 00101101
    </text>
    <text transform="translate(120,210) rotate(-30)" opacity="0.85">
      11010010 10100101 01101001 10100101 01011010 10010110
    </text>
    <text transform="translate(190,230) rotate(-30)" opacity="0.8">
      00101101 10010110 01011001 10100101 01101001 10100101
    </text>
    
    <!-- Secondary streams -->
    <text transform="translate(-50,170) rotate(-30)" opacity="0.7">
      10101010 01010101 10011001 01010101 10101010 01010101
    </text>
    <text transform="translate(20,190) rotate(-30)" opacity="0.65">
      01010101 10011001 01010101 10101010 01010101 10011001
    </text>
    
    <!-- Tertiary streams -->
    <text transform="translate(250,230) rotate(-30)" opacity="0.55">
      11001100 00110011 11001100 00110011 11001100 00110011
    </text>
    <text transform="translate(320,250) rotate(-30)" opacity="0.5">
      00110011 11001100 00110011 11001100 00110011 11001100
    </text>
    
    <!-- Reverse diagonal streams for depth -->
    <text transform="translate(700,180) rotate(30)" opacity="0.6">
      10010110 01011001 10100101 01101001 10100101 01011010
    </text>
    <text transform="translate(630,200) rotate(30)" opacity="0.55">
      01101001 00101101 10010110 01011001 11010010 10100101
    </text>
  </g>
  
  <!-- Subtle grid pattern -->
  <g stroke="#b3937b" stroke-width="0.3" opacity="0.15">
    <!-- Horizontal lines -->
    <path d="M0 40h800" transform="rotate(-30,400,100)"/>
    <path d="M0 80h800" transform="rotate(-30,400,100)"/>
    <path d="M0 120h800" transform="rotate(-30,400,100)"/>
    <path d="M0 160h800" transform="rotate(-30,400,100)"/>
    
    <!-- Diagonal cross pattern -->
    <path d="M0 0l800 800" stroke-opacity="0.1"/>
    <path d="M800 0L0 800" stroke-opacity="0.1"/>
  </g>
</svg>