<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" style="background:#000">
  <!-- Binary Stream -->
  <g fill="#b3937b" font-family="monospace" font-size="14" opacity="0.85">
    <text x="10" y="30">01101001 00101101 10010110 01011001</text>
    <text x="50" y="55">11010010 10100101 01101001 10100101</text>
    <text x="20" y="80">01011010 10010110 01011001 10100101</text>
    <text x="35" y="105">10101101 01101001 10100101 01011010</text>
    <text x="5" y="130">00101101 10010110 01011001 10100101</text>
    <text x="40" y="155">01101001 10100101 01011010 10010110</text>
    <text x="15" y="180">10010110 01011001 10100101 01101001</text>
    
    <!-- Secondary streams -->
    <g opacity="0.65">
      <text x="250" y="45">10011001 01010101 10101010 01010101</text>
      <text x="300" y="70">01010101 10101010 01010101 10011001</text>
      <text x="280" y="95">10101010 01010101 10011001 01010101</text>
    </g>
    
    <g opacity="0.45">
      <text x="500" y="60">11001100 00110011 11001100 00110011</text>
      <text x="550" y="85">00110011 11001100 00110011 11001100</text>
      <text x="520" y="110">11001100 00110011 11001100 00110011</text>
    </g>
  </g>
  
  <!-- Vertical streams -->
  <g stroke="#b3937b" stroke-width="2" opacity="0.25">
    <path d="M150 0v200"/>
    <path d="M350 0v200"/>
    <path d="M550 0v200"/>
    <path d="M750 0v200"/>
  </g>
  
  <!-- Background glow effect -->
  <g stroke="#b3937b" stroke-width="1" opacity="0.15">
    <ellipse cx="400" cy="100" rx="350" ry="80"/>
    <ellipse cx="400" cy="100" rx="250" ry="60"/>
  </g>
</svg>